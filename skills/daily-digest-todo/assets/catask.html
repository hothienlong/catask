oint trước buổi chốt sprint."],aiInstr9:"Viết lại description cho ticket: bối cảnh, phạm vi, việc cần làm, phụ thuộc.",aiCtx9:"Đối tác gửi mail: SDK 4.x ngừng hỗ trợ từ 01/12, cần lên 5.2. Đổi hàm khởi tạo và callback kết quả. Tài liệu: link SDK 5.2 trong mail.",aiAfter9:`## Bối cảnh
Đối tác thanh toán ngừng hỗ trợ SDK 4.x từ 01/12. App cần lên SDK 5.2.

## Phạm vi
- Android và iOS, luồng thanh toán bằng ví đối tác.
- Không đổi giao diện.

## Việc cần làm
- Nâng SDK lên 5.2 trên cả hai nền tảng.
- Đổi hàm khởi tạo và callback kết quả theo tài liệu mới.
- Test lại thanh toán thành công / huỷ / lỗi mạng trên môi trường thử.

## Phụ thuộc
- Đối tác cấp key môi trường thử cho SDK 5.2.

## Acceptance criteria
- Thanh toán qua ví đối tác chạy được với SDK 5.2 trên Android và iOS.
- Không còn tham chiếu tới SDK 4.x.`,aiNote9:"Dựa trên ngữ cảnh bạn dán; chưa rõ hạn chót phía đối tác cho môi trường thử, mình để ở mục Phụ thuộc.",aiS9:"Đọc ticket trên Jira (chỉ đọc)",aiS9b:"Đang soạn description",aiS10:"Đọc 3 ticket tương tự để so",aiNote10:"5 point: đổi 2 màn hình + thêm đếm ngược gửi lại mã; tương tự MOB-1980 \
