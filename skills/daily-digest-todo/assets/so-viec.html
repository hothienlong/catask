/* Masthead: an anime sky painted on canvas behind the title */
.mast { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 28px;
  padding: 22px 26px 78px; border-radius: 22px; background: linear-gradient(var(--sky-top), var(--sky-bot)); color: var(--on-sky) }
.mast canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0 }
.mascot { width: 76px; height: 76px; margin: -6px 0 -10px; flex: none; background: var(--cat-idle) no-repeat center / contain; filter: drop-shadow(0 4px 6px rgba(0, 40, 90, .28)) }
.wm { display: inline-flex; align-items: baseline; font-family: var(--display); font-weight: 800; letter-spacing: -.01em; line-height: 1 }
.wm-lg { font-size: 26px; text-shadow: 0 2px 0 rgba(0, 40, 90, .2) }
.wm-cat { position: relative; color: #ffd36b }
.wm-cat::before, .wm-cat::after { content: ""; position: absolute; top: -.1em; width: 0; height: 0; border-left: .14em solid transparent; border-right: .14em solid transparent; border-bottom: .24em solid currentColor }
.wm-cat::before { left: .06em; transform: rotate(-14deg) } .wm-cat::after { right: .04em; transform: rotate(14deg) }
.wm-ask { color: var(--on-sky) }
.wm-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 6px 0 4px }
.slogan { font-size: 12.5px; font-weight: 600; opacity: .8 }
.mc-home .wm { font-size: 19px }
.brand .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .88 }
.brand h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.05; letter-spacing: -.01em; text-shadow: 0 2px 0 rgba(0, 40, 90, .2) }
.brand h1 em { font-style: normal; opacity: .9 }
.tally { margin-left: auto; display: flex; flex-wrap: wrap; gap: 22px; font-variant-numeric: tabular-nums }
.tally div { display: flex; flex-direction: column; align-items: flex-end }
.tally b { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-shadow: 0 2px 0 rgba(0, 40, 90, .2) }
.tally span { font-size: 11.5px; opacity: .9; text-shadow: 0 1px 2px rgba(0, 30, 70, .45) }
.mast > .brand, .mast > .tally { position: relative; z-index: 1 }
.tally .is-over b { background: #ffffff; color: #c4321b; padding: 1px 9px 3px; border-radius: 999px; text-shadow: none }
nav.tabs { display: flex; align-items: center; gap: 6px; padding: 8px 0 6px; margin-top: 4px; overflow-x: auto; scrollbar-width: none }
nav.tabs a { padding: 6px 15px; border-radius: 999px; color: var(--soft); text-decoration: none; font-weight: 700; font-family: var(--display); white-space: nowrap; transition: background .18s, color .18s }
.proj-seg { margin: 0 0 0 auto; align-self: center; position: static; padding: 3px }
/* .seg (defined later) adds margin-bottom: 14px, which pushed the project pills 7px above the nav's centre line. */
nav.tabs .proj-seg { margin: 0 0 0 auto }
.proj-seg { flex: none }
.proj-seg button { padding: 3px 12px; font-size: 12.5px; white-space: nowrap }
.info-btn { margin-left: 4px; align-self: center; border: 0; background: transparent; color: var(--soft); font-size: 12.5px; font-weight: 600; line-height: 1; cursor: pointer; height: 30px; padding: 0 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px }
/* ⓘ and ⚙ share one box and size, drawn as text glyphs (not emoji), so both sit on the same centre line. */
.ib-ic { display: inline-grid; place-items: center; width: 15px; height: 15px; flex: none; font-size: 14px; line-height: 1 }
.ib-ic svg { width: 15px; height: 15px; display: block }
.info-btn:hover, .info-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink) }
.howto { position: relative; margin-top: 10px; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 16px; background: var(--lift); box-shadow: var(--shadow); font-size: 13px }
.howto-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 26px }
.howto h3 { margin: 0 0 6px; font-family: var(--display); font-size: 14px; color: var(--accent) }
.howto ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--soft) }
.howto b { color: var(--ink) }
.howto-close { position: absolute; top: 10px; right: 12px; border: 0; background: transparent; color: var(--soft); cursor: pointer; font-size: 12px }
@media (max-width: 900px) { .howto-grid { grid-template-columns: 1fr } }
.demo-btn { align-self: center; align-self: center; border: 1.5px dashed var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 4px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap }
.demo-btn:hover { background: var(--accent-wash) }
/* Owner-only: the demo entry lives in the how-it-works panel, the way back only shows during the demo. */
.howto-foot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--soft); font-size: 12.5px }
.howto-foot[hidden] { display: none }
.demo-link { padding: 0; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer }
.demo-link:hover { text-decoration-thickness: 2px }
nav.tabs a:hover { background: var(--hover); color: var(--ink) }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--lift) }
.status { font-size: 12.5px; color: var(--soft); padding: 6px 0 0; min-height: 24px }
.status.warn { color: var(--soon) }
.empty { display: flex; align-items: center; gap: 10px }
.empty::before { content: ""; width: 54px; height: 34px; flex: none; background: var(--cat-sleep) no-repeat center / contain }
.empty.happy::before { width: 44px; height: 44px; background-image: var(--cat-happy) }
.w-over::before { content: ""; display: inline-block; width: 14px; height: 14px; margin: 0 4px -3px -3px; background: var(--cat-alert) no-repeat center / contain }
@media (prefers-reduced-motion: no-preference) {
  .mascot { animation: bob 4.5s ease-in-out infinite }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg) } }
}

.view { flex: 1; min-height: 0 }
.label { margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft) }
.label .n { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0 }
.label.acc { color: var(--accent) }
.scroll { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--rule) transparent }
.empty { color: var(--faint); font-size: 13px; padding: 6px 0 }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px }

/* Today: rail + four columns */
.today { height: 100%; display: grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 3.2fr) }
.rail { padding: 16px 24px 28px 0; border-right: 1px solid var(--rule) }
.three { list-style: none; margin: 0; padding: 0; counter-reset: k }
.three li { counter-increment: k; display: grid; grid-template-columns: 44px 1fr 26px; gap: 0 8px; align-items: start; padding: 12px 0; border-top: 1px solid var(--rule) }
.big-check { appearance: none; width: 24px; height: 24px; margin: 2px 0 0; border: 2px solid var(--accent); border-radius: 50%; background: var(--lift); cursor: pointer; display: grid; place-items: center; transition: background .2s, transform .2s var(--ease) }
.big-check:hover { transform: scale(1.08) }
.big-check:checked { background: var(--accent) }
.big-check:checked::after { content: ""; width: 5px; height: 10px; margin-top: -3px; border: solid var(--lift); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) }
.three li.is-done .tt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--faint) }
.three li.is-done::before { color: var(--faint) }
.three li:first-child { border-top: 0; padding-top: 2px }
.three li::before { content: counter(k); font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .9; color: var(--accent); letter-spacing: -.04em }
.three .tt { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.22; text-wrap: balance }
.three .sub { margin-top: 3px; font-size: 12.5px; color: var(--soft); display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.rail .block + .block { margin-top: 26px }
.mini { padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13px }
.mini:first-of-type { border-top: 0; padding-top: 0 }
.mini .when { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px }
.mini .sm { color: var(--soft); font-size: 12.5px }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); min-height: 0 }
.lane { min-width: 0; display: flex; flex-direction: column; min-height: 0; padding: 16px 14px 0; border-right: 1px solid var(--rule); transition: background .15s }
.lane:last-child { border-right: 0; padding-right: 0 }
.lane.drop { background: var(--accent-wash) }
.lane .scroll { flex: 1; padding-bottom: 28px; display: flex; flex-direction: column; gap: 8px }
.card { position: relative; background: var(--lift); border: 1px solid var(--rule); border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; cursor: grab; transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s }
.card:hover { box-shadow: var(--shadow); transform: translateY(-1px) }
.card.dragging { opacity: .4 }
.card.enter { animation: enter .35s var(--ease) }
.card .top { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start }
.card input { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; border: 1.5px solid var(--faint); border-radius: 6px; cursor: pointer; display: grid; place-items: center }
.card input:checked { background: var(--accent); border-color: var(--accent) }
.card input:checked::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg) }
.card .tt { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere }
.card.is-done .tt { text-decoration: line-through; color: var(--faint) }
.who { font-size: 12.5px } .who b { font-weight: 600 }
.why { font-size: 12.5px; color: var(--soft); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer }
.why.open { -webkit-line-clamp: unset }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 11.5px; color: var(--soft) }
.warn-chip { font-size: 11px; font-weight: 600; padding: 0 7px; line-height: 18px; border-radius: 999px; white-space: nowrap }
.w-over { background: var(--over-wash); color: var(--over) } .w-soon { background: var(--soon-wash); color: var(--soon) } .w-nudge { background: var(--accent-wash); color: var(--accent) }
.due { color: var(--accent); font-weight: 600 }
.open-link { color: var(--accent); text-decoration: none; font-weight: 600 }
.open-link:hover { text-decoration: underline }
.moves { display: flex; gap: 4px; flex-wrap: wrap; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .2s var(--ease), opacity .2s }
.card:hover .moves, .card:focus-within .moves { max-height: 40px; opacity: 1 }
@media (hover: none) { .moves { max-height: none; opacity: 1 } .card { cursor: auto } }
.moves button { font-size: 11px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; cursor: pointer; color: var(--soft) }
.moves button:hover { border-color: var(--ink); color: var(--ink) }
.tag { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; cursor: pointer; line-height: 16px }
.tag:hover, .tag[aria-expanded="true"] { background: var(--ink); color: var(--paper) }
.tag.good { border-color: var(--accent); color: var(--accent) }
.tag.good:hover, .tag.good[aria-expanded="true"] { background: var(--accent); color: var(--paper) }
.note { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease) }
.note > div { overflow: hidden; font-size: 12px }
.note > div > p { margin: 4px 0 0; padding: 4px 0 2px 9px; border-left: 2px solid var(--ink) }
.note.good > div > p { border-left-color: var(--accent) }
.note.show { grid-template-rows: 1fr }
.win { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 8px 2px; border-top: 1px solid var(--rule); font-size: 13px }
.win:first-child { border-top: 0 }
.dot-done { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; background: var(--accent); position: relative }
.dot-done::after { content: ""; position: absolute; left: 4.5px; top: 2px; width: 3.5px; height: 7px; border: solid var(--paper); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg) }
.win .sm { color: var(--soft); font-size: 12px }
.sub-label { margin: 12px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint) }

/* People */
.people { height: 100%; padding: 14px 0 28px }
.seg { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 999px; background: var(--hover); position: sticky; top: 0; z-index: 2 }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-family: var(--display); color: var(--soft); transition: background .18s, color .18s }
.seg button span { font-family: var(--text); font-weight: 600; font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums }
.seg button:hover { color: var(--ink) }
.seg button[aria-pressed="true"] { background: var(--lift); color: var(--accent); box-shadow: var(--shadow) }
.person { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 24px; padding: 18px 0; border-top: 1px solid var(--rule) }
.person:first-child { border-top: 0; padding-top: 4px }
.av { border-radius: 50%; background: var(--accent-wash); border: 1.5px solid var(--lift); object-fit: cover; flex: none }
.av.xs { width: 20px; height: 20px; vertical-align: -5px; margin-right: 6px }
.av.lg { width: 56px; height: 56px; border: 2px solid var(--accent-wash); box-shadow: var(--shadow) }
:root:not([data-theme="light"]) .av { background: #dbeafb }
.phead { display: flex; align-items: center; gap: 12px }
.faces { display: inline-flex; margin-right: 8px; vertical-align: -5px }
.faces .av.xs { margin-right: -7px } .faces .av.xs:last-child { margin-right: 0 }
.peep-ill { float: right; width: 76px; height: auto; margin: -6px 0 0 12px; opacity: .95; background: #dbeafb; border-radius: 16px; padding: 6px }
.person h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15 }
.person .role { font-size: 12.5px; color: var(--soft) }
.ledger { display: flex; gap: 18px; margin-top: 10px; font-variant-numeric: tabular-nums }
.ledger div { display: flex; flex-direction: column }
.ledger b { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1 }
.ledger span { font-size: 11.5px; color: var(--soft) }
.person .worst { margin-top: 8px }
.items { display: flex; flex-direction: column }
.it { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--rule) }
.it:first-child { border-top: 0; padding-top: 0 }
.it .tt { font-weight: 600 }
.it .dir { font-size: 12px; color: var(--soft) }
.it .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
/* "View message": always-visible pill on every task (not inside the hover-only .moves row). */
.view-msg { font: 600 11.5px/18px var(--text); padding: 1px 9px 1px 7px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--lift); cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; flex: none; vertical-align: 1px }
.view-msg .ic { font-size: 11px; line-height: 1 }
.view-msg:hover { background: var(--accent); color: var(--paper) }
.card .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.card .who .who-l { min-width: 0; flex: 1 1 auto }
.three .sub .view-msg, .win .view-msg, .ev .view-msg { margin-left: 6px }
/* Task titles open the same dialog; the pill button is the keyboard path. */
.tt-link { cursor: pointer }
.tt-link:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px }
.it { grid-template-columns: 18px 1fr auto }
.it .chk, .win .chk { appearance: none; width: 16px; height: 16px; margin: 3px 0 0; border: 1.5px solid var(--faint); border-radius: 6px; cursor: pointer; display: grid; place-items: center; background: var(--lift) }
.it .chk:checked, .win .chk:checked, .ev .chk:checked { background: var(--accent); border-color: var(--accent) }
.it .chk:checked::after, .win .chk:checked::after, .ev .chk:checked::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg) }
.it.is-done .tt, .win.is-done .wt, .ev.is-done .tt span.tx { text-decoration: line-through; color: var(--faint) }
.win.has-chk { grid-template-columns: 18px 1fr }
.ev .chk { appearance: none; width: 15px; height: 15px; margin: 0 6px -2px 0; border: 1.5px solid var(--faint); border-radius: 5px; cursor: pointer; display: inline-grid; place-items: center; background: var(--lift); vertical-align: -2px }
/* Priority badge: criticality P0–P3, separate from urgency (due date). Click to cycle. */
.pri { font: 700 10.5px/16px var(--text); letter-spacing: .02em; padding: 0 6px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums }
.pri[disabled] { cursor: default }
.pri.p0 { background: var(--over); color: #ffffff }
.pri.p1 { background: var(--soon-wash); color: var(--soon); border-color: var(--soon) }
.pri.p2 { background: var(--accent-wash); color: var(--accent) }
.pri.p3 { background: transparent; color: var(--faint); border-color: var(--rule) }
.pri:not([disabled]):hover { outline: 1.5px solid var(--ink); outline-offset: 1px }
.card .top { grid-template-columns: 18px 1fr auto }
.three .tt .pri, .it .tt .pri { margin-right: 6px; vertical-align: 2px }
.flag { font-size: 10.5px; font-weight: 600; padding: 0 6px; line-height: 16px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap }
.pri-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--soft) }
.pri-legend .pri { cursor: default }
/* "View message" dialog */
.dlg-back { position: fixed; inset: 0; z-index: 50; background: rgba(8, 22, 44, .45); display: grid; place-items: center; padding: 16px }
.dlg-back[hidden] { display: none }
.dlg { width: min(520px, 100%); max-height: min(80vh, 640px); overflow: auto; background: var(--lift); color: var(--ink); border: 1px solid var(--rule); border-radius: 18px; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .55); padding: 18px 20px 16px; position: relative }
.dlg h2 { margin: 0 34px 4px 0; font-family: var(--display); font-size: 17px; line-height: 1.25 }
.dlg .dlg-meta { font-size: 12.5px; color: var(--soft); display: flex; flex-wrap: wrap; gap: 4px 10px }
.dlg blockquote { margin: 14px 0 10px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-wash); border-radius: 0 10px 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px }
.dlg .dlg-note { font-size: 11.5px; color: var(--faint) }
.dlg .dlg-ctx { margin: 14px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft) }
.dlg .dlg-why { margin: 0 0 10px; font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap }
/* Communication signals, attached under the quote (or the Context block): badges + their notes, always open */
.dlg .dlg-sig { margin: -2px 0 12px }
.dlg .dlg-sig h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft) }
.dlg .dlg-tags { display: flex; flex-wrap: wrap; gap: 6px }
.dlg .dlg-tags .tag { cursor: default; display: inline-block }
.dlg .dlg-tags .tag:hover { background: transparent; color: inherit }
.dlg .dlg-tags .tag.good:hover { color: var(--accent) }
.dlg .dlg-sig ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px }
.dlg .dlg-sig li { font-size: 12.5px; padding: 2px 0 2px 9px; border-left: 2px solid var(--ink); overflow-wrap: anywhere }
.dlg .dlg-sig li.good { border-left-color: var(--accent) }
.dlg .dlg-sig li.good b { color: var(--accent) }
.dlg .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px }
.dlg .dlg-open { padding: 6px 14px; border-radius: 999px; background: var(--accent); color: var(--lift); text-decoration: none; font-weight: 600 }
.dlg .dlg-x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 16px; color: var(--soft) }
.dlg .dlg-x:hover { background: var(--hover); color: var(--ink) }
@media (max-width: 560px) { .dlg-back { place-items: end stretch; padding: 0 } .dlg { width: 100%; border-radius: 18px 18px 0 0; max-height: 85vh } }
.dlg .dlg-actions { flex-wrap: wrap; align-items: center }
/* "Hand to AI": a quiet pill on open tasks; once requested, a status chip replaces it. */
.ai-btn, .ai-chip { font: 600 11.5px/18px var(--text); padding: 1px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 4px; vertical-align: 1px }
.ai-btn { border: 1.5px dashed var(--faint); color: var(--soft); background: var(--lift) }
.ai-btn:hover { border-style: solid; border-color: var(--accent); color: var(--accent) }
.ai-chip { border: 1.5px solid transparent }
.ai-chip.ai-queued { background: var(--hover); color: var(--soft); border-color: var(--rule) }
.ai-chip.ai-running { background: var(--accent-wash); color: var(--accent) }
.ai-chip.ai-needs_review { background: var(--accent); color: var(--lift); font-weight: 700; box-shadow: var(--shadow) }
.ai-chip.ai-error { background: var(--over-wash); color: var(--over); border-color: var(--over) }
.ai-chip.ai-accepted, .ai-chip.ai-cancelled { background: transparent; color: var(--faint); border-color: var(--rule); cursor: default }
.ai-chip:not(.ai-accepted):not(.ai-cancelled):hover { outline: 1.5px solid var(--ink); outline-offset: 1px }
.three .sub .ai-btn, .three .sub .ai-chip, .dlg-actions .ai-btn, .dlg-actions .ai-chip { margin-left: 6px }
@media (prefers-reduced-motion: no-preference) {
  .ai-chip.ai-running { animation: ai-pulse 1.8s ease-in-out infinite }
  @keyframes ai-pulse { 50% { opacity: .55 } }
}
.tally .tally-ai { display: flex; flex-direction: column; align-items: flex-end; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0; font: inherit }
.tally .tally-ai b { background: #ffffff; color: #2a80d2; padding: 1px 9px 3px; border-radius: 999px; text-shadow: none }
.tally .tally-ai:hover span { text-decoration: underline }
/* AI request form + AI panel, inside the dialog shell */
.ai-kinds { border: 0; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.ai-kinds legend { padding: 0; margin-bottom: 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft) }
.ai-kind { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 12px; cursor: pointer }
.ai-kind:hover { background: var(--hover) }
.ai-kind input { margin: 3px 0 0; accent-color: var(--accent) }
.ai-kind small { display: block; font-size: 12px; color: var(--soft) }
.ai-note-l { display: block; margin: 12px 0 4px; font-size: 12.5px; color: var(--soft) }
.ai-count { float: right; font-variant-numeric: tabular-nums; color: var(--faint) }
.ai-read { display: grid; grid-template-columns: 17px 1fr; gap: 10px; align-items: start; margin-top: 10px; font-size: 13px; cursor: pointer }

.ai-read small { display: block; font-size: 12px; color: var(--soft) }
.ai-safe { margin: 10px 0 0; font-size: 12.5px; font-weight: 600; color: var(--soon) }
.ai-hint { margin: 6px 0 0; font-size: 12px; color: var(--faint) }
.ai-steps { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--rule); display: grid; gap: 4px; font-size: 12.5px }

.ai-res-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 14px 0 6px }
.ai-res-h .dlg-ctx { margin: 0 }
.ai-copy { padding: 3px 12px; font-size: 12.5px }
.ai-result { margin: 0; padding: 10px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; background: var(--paper); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.55 }
.ai-copied { display: block; min-height: 16px; font-size: 12px; color: var(--accent) }
.ai-src { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px }
.ai-err { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--over-wash); color: var(--over); font-size: 12.5px; overflow-wrap: anywhere }
.ai-chip.ai-approved { background: var(--accent-wash); color: var(--accent); border-color: var(--accent) }
.ai-chip.ai-applied { background: transparent; color: var(--accent); border-color: var(--accent-wash) }
.ai-kick { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 0 34px 2px 0 }
.ai-known { margin: 8px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); font-size: 12.5px }
.ai-known summary { cursor: pointer; padding: 7px 12px; font-weight: 600; color: var(--soft) }
.ai-known summary .ai-count { float: none; margin-left: 8px; font-weight: 400 }
.ai-known dl { margin: 0; padding: 0 12px 4px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px }
.ai-known dt { color: var(--soft) } .ai-known dd { margin: 0; overflow-wrap: anywhere }
.ai-known q { font-style: italic } .ai-known .ak-by { color: var(--soft) }
.ai-known .ai-hint { padding: 0 12px 8px }
.ai-kchips { display: flex; flex-wrap: wrap; gap: 6px }
.ai-kc { position: relative; cursor: pointer }
.ai-kc input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0 }
.ai-kc span { display: inline-block; padding: 5px 12px; border: 1.5px solid var(--rule); border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--lift) }
.ai-kc:hover span { background: var(--hover) }
.ai-kc input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--lift) }
.ai-kc input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px }
.ai-modes { margin-top: 14px }
textarea.ai-ctx { min-height: 110px }
textarea.ai-after { min-height: 180px; font-size: 13px; line-height: 1.5 }

.ai-before { margin: 0; padding: 8px 12px; border: 1px dashed var(--rule); border-radius: 10px; background: var(--paper); color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; max-height: 220px; overflow: auto }

.ai-tag { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent) }
.ai-warn { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--soon-wash); color: var(--soon); font-size: 12.5px; overflow-wrap: anywhere }
.ai-ok { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-wash); color: var(--accent); font-size: 13px; font-weight: 600 }
.ai-confirm { margin: 12px 0 0; padding: 10px 12px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--accent-wash) }

.ai-confirm p { margin: 0 0 6px; font-size: 13px } .ai-confirm .dlg-actions { margin-top: 8px }
.ai-note-r { border-left-color: var(--rule); font-size: 12.5px }
@media (max-width: 560px) { .ai-known dl { grid-template-columns: minmax(0, 1fr); gap: 0 } .ai-known dd { margin-bottom: 4px } .ai-foot .btn-pri, .ai-foot .btn-sec { flex: 1 1 auto } }

/* Week */
.week { height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0 }
.week > section { padding: 18px 26px 28px 0 }
.week > section + section { padding: 18px 0 28px 26px; border-left: 1px solid var(--rule) }
.big { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 26px }
.big div { display: flex; flex-direction: column }
.big b { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.big b.acc { color: var(--accent) }
.big span { font-size: 12.5px; color: var(--soft) }
.heatwrap { display: flex; flex-wrap: wrap; align-items: stretch; gap: 18px 28px }
.heatcol { flex: 1 1 300px; max-width: 460px; min-width: 0 }
.heatside { flex: 1 1 200px; min-width: 0; display: flex; gap: 14px; align-items: flex-end; padding: 14px 16px; border-radius: 18px; background: var(--hover) }
.heatside img { width: 84px; height: auto; flex: none }
.heatside dl { margin: 0; display: flex; flex-direction: column; gap: 10px }
.heatside dt { font-size: 11.5px; color: var(--soft) }
.heatside dd { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1 }
.heat { display: grid; grid-template-columns: 48px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; font-size: 11.5px; color: var(--soft) }
.heat .cell { aspect-ratio: 1; max-width: 100%; border-radius: 5px; background: var(--hover); display: grid; place-items: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); font-size: 12px; transition: transform .15s }
.heat .cell:hover { transform: scale(1.08) }
.heat .cell.today { outline: 2px solid var(--ink); outline-offset: 1px }
.legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11.5px; color: var(--soft) }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block }
.sigrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.sigrow span { font-size: 12px; padding: 2px 10px; border: 1px solid var(--rule); border-radius: 999px }
.dayhead { margin: 18px 0 4px; font-size: 12px; font-weight: 600; color: var(--soft) }
.dayhead:first-child { margin-top: 0 }

/* Day timeline */
.day { height: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) }
.day > section { padding: 16px 26px 28px 0 }
.day > section + section { padding: 16px 0 28px 26px; border-left: 1px solid var(--rule) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px }
.chips button { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 12.5px; font-variant-numeric: tabular-nums }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.line { position: relative; list-style: none; margin: 0; padding: 0 0 0 76px }
.line::before { content: ""; position: absolute; left: 62px; top: 6px; bottom: 6px; width: 1px; background: var(--rule) }
.ev { position: relative; padding: 0 0 16px }
.ev .t { position: absolute; left: -76px; width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px }
.ev::before { content: ""; position: absolute; left: -18px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); border: 2px solid var(--faint) }
.ev.k-done::before { background: var(--accent); border-color: var(--accent) }
.ev.k-meeting::before { border-color: var(--ink); background: var(--ink) }
.ev.k-ai::before { border-color: var(--accent) }
.ev .kind { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft) }
.ev.k-done .kind { color: var(--accent) }
.ev .tt { font-weight: 600 }
.ev .sm { font-size: 12.5px; color: var(--soft) }
.bar { height: 4px; border-radius: 2px; background: var(--accent-wash); margin-top: 5px; max-width: 100% }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent) }

/* Project hours: ranked bars, one hue; the number carries identity, not color */
.pbars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px }
.pb { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px }
.pb .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pb .track { height: 10px; border-radius: 0 4px 4px 0; background: var(--hover); position: relative }
.pb .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--accent); transition: width .5s var(--ease) }
.pb .val { font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; min-width: 92px; text-align: right }
.pb .val span { color: var(--soft) }
.pb:hover .track { outline: 1px solid var(--rule) }
.ptable-wrap { overflow-x: auto; margin-top: 14px }
.ptable { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 100% }
.ptable th, .ptable td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap }
.ptable th:first-child, .ptable td:first-child { text-align: left; padding-left: 0 }
.ptable th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft) }
.ptable tfoot td { font-weight: 600; border-bottom: 0 }
.ptable td.z { color: var(--faint) }
.note-sm { font-size: 12px; color: var(--faint); margin-top: 6px }
/* Settings drawer: the page-editable part of config.json, written to meta/settings. */
.set-back { position: fixed; inset: 0; z-index: 60; background: rgba(8, 22, 44, .45); display: flex; justify-content: flex-end }
.set-back[hidden] { display: none }
.set-panel { width: min(460px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); border-left: 1px solid var(--rule); border-radius: 18px 0 0 18px; box-shadow: -20px 0 50px -30px rgba(0, 0, 0, .55); overflow: hidden; outline: none }
.set-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--rule) }
.set-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-size: 19px; line-height: 1.2 }
.set-x { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 16px; color: var(--soft) }
.set-x:hover { background: var(--hover); color: var(--ink) }
.set-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 20px 20px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent }
.set-intro { margin: 12px 0 4px; font-size: 12.5px; color: var(--soft) }
.set-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--soon-wash); color: var(--soon); font-size: 12.5px }
.set-sec { padding: 16px 0; border-top: 1px solid var(--rule); min-width: 0 }
.set-sec:first-of-type { border-top: 0 }
.set-sec h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft) }
.set-hint { display: block; margin: 6px 0 0; font-size: 12px; color: var(--faint); overflow-wrap: anywhere }
.set-err { margin: 8px 0 0; font-size: 12.5px; color: var(--over) }
.set-id { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px }
.set-id dt { color: var(--soft) } .set-id dd { margin: 0; font-weight: 600; overflow-wrap: anywhere }
.set-seg { position: static; margin: 0 }
.set-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end }
.set-field { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--soft) }
.set-field.wide { flex-basis: 100% }
.set-in { width: 100%; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--lift); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 10px }
textarea.set-in { min-height: 70px; resize: vertical }
.set-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.set-in[disabled], .set-panel button[disabled], .set-panel input[disabled] { opacity: .55; cursor: default }
.set-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.set-checks label { display: flex; align-items: center; gap: 10px; cursor: pointer }
.set-cb { flex: none; width: 17px; height: 17px; margin: 0; accent-color: var(--accent) }
.set-days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px }
.set-days button { min-width: 42px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600 }
.set-days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--lift) }
.chips-ed { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px }
.chips-ed li { max-width: 100%; display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px 2px 11px; border-radius: 999px; background: var(--accent-wash); font-size: 12.5px }
.chips-ed li > span { min-width: 0; overflow-wrap: anywhere }
.chips-ed small { color: var(--soft); font-size: 12px }
.chip-x { flex: none; width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; color: var(--soft); font-size: 11px }
.chip-x:hover { background: var(--lift); color: var(--ink) }
.set-add { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; cursor: pointer }
.set-add:hover { background: var(--accent-wash) }
.set-switch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 14px; align-items: start; padding: 6px 0; cursor: pointer }
.set-switch + .set-switch { margin-top: 8px }
.sw { appearance: none; position: relative; width: 38px; height: 22px; margin: 2px 0 0; border-radius: 999px; background: var(--rule); cursor: pointer; transition: background .2s }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--lift); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .2s var(--ease) }
.sw:checked { background: var(--accent) } .sw:checked::after { transform: translateX(16px) }
.set-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--lift) }
.set-dirty { flex: 1 1 140px; min-width: 0; font-size: 12.5px; color: var(--soft) }
.set-dirty.on { color: var(--soon); font-weight: 600 }
.set-dirty.on::before { content: "●"; margin-right: 6px }
.btn-pri { padding: 7px 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--lift); font-weight: 700; cursor: pointer }
.btn-sec { padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; font-weight: 600; cursor: pointer }
.btn-sec:hover { background: var(--hover) }
@media (max-width: 560px) {
  .set-panel { width: 100%; border-radius: 0; border-left: 0 }
  .set-head, .set-body, .set-foot { padding-left: 16px; padding-right: 16px }
}
/* Undo snackbar: one at a time, a one-line inverted pill at the bottom centre (full width minus
   16px gutters on phones). Centred with auto margins, not a transform, so the enter slide can use one. */
.snack { position: fixed; z-index: 70; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; max-width: min(440px, calc(100vw - 32px)); min-height: 44px;
  display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 999px; overflow: hidden; white-space: nowrap;
  background: var(--ink); color: var(--paper); box-shadow: var(--shadow), 0 18px 40px -16px rgba(0, 0, 0, .55); font-size: 13.5px; line-height: 20px;
  opacity: 1; transition: opacity .15s ease, display .15s allow-discrete }
.snack[hidden] { display: none; opacity: 0 }
.snack-ic { flex: none; width: 16px; text-align: center; font-weight: 700 }
.snack-ic:not(.pri) { color: var(--snack-act) }
.snack-ic.pri { width: auto; cursor: default; outline: 0 !important }
.snack-msg { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 6px }
.snack-v { flex: none }
.snack-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700 }
.snack-undo { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--snack-act); font: inherit; font-weight: 700; cursor: pointer }
.snack-kbd { flex: none; margin-left: -4px; font: 600 11px/1 var(--text); color: var(--paper); opacity: .6 }
.snack-x { flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--paper); opacity: .6; font-size: 12px; line-height: 28px; cursor: pointer }
.snack-undo:hover, .snack-x:hover { background: color-mix(in srgb, var(--paper) 14%, transparent); opacity: 1 }
.snack :focus-visible { outline-color: var(--snack-act) }
.snack-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--snack-act); opacity: .85; transform-origin: left center; pointer-events: none }
.snack.paused .snack-bar { animation-play-state: paused }
@media (hover: none), (max-width: 599px) { .snack-kbd { display: none } }
@media (max-width: 599px) { .snack { width: auto; max-width: none } }
@media (prefers-reduced-motion: no-preference) {
  .snack:not([hidden]) { animation: snack-in .18s var(--ease) }
  .snack-bar { animation: snack-count linear forwards }
}
@media (prefers-reduced-motion: reduce) { .snack:not([hidden]) { animation: snack-fade .18s ease } }
@keyframes snack-in { from { opacity: .001; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes snack-fade { from { opacity: .001 } to { opacity: 1 } }
@keyframes snack-count { from { transform: scaleX(1) } to { transform: scaleX(0) } }
@keyframes enter { from { opacity: .001; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: no-preference) {
  /* Entry animation only when the tab changes (.view.anim); data-driven re-renders stay still. */
  .view.anim .three li { animation: enter .55s var(--ease) both } .view.anim .three li:nth-child(2) { animation-delay: .08s } .view.anim .three li:nth-child(3) { animation-delay: .16s }
  .view.anim > * { animation: enter .3s var(--ease) }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }

/* Chips in a meta row: one flex-wrap gap system (Xem tin, Giao AI, copy id), no stray margins. */
.three .sub .view-msg, .three .sub .ai-btn, .three .sub .ai-chip { margin-left: 0 }

      var gr = c.createLinearGradient(0, y - 55 * s, 0, y + 22 * s); gr.addColorStop(0, top); gr.addColorStop(.55, top); gr.addColorStop(1, shade);
      c.fillStyle = gr; puffs.forEach(function (p) { c.beginPath(); c.arc(p[0], p[1], p[2], 0, Math.PI * 2); c.fill() });
      c.globalAlpha = .45; c.lineWidth = 1;
